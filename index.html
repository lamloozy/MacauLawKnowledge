<html lang="zh-Hans">
<head>
<meta charset="UTF-8">

<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  :root {
    --bg: #f3f6f9;
    --card: #ffffff;
    --text: #16202a;
    --muted: #5c6b7a;
    --duo-green: #16a34a;
    --duo-green-dark: #15803d;
    --duo-green-soft: #dcfce7;
    --accent: #0b5e8a;
    --accent-soft: #e6f1f8;
    --warn: #b45309;
    --warn-soft: #fef3c7;
    --border: #dce3ea;
    --radius: 18px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans Myanmar", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    padding: 0 16px calc(56px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 600px; margin: 0 auto; }

  /* 顶部与语言切换 */
  header { padding: 24px 0 14px; text-align: center; }
  header h1 {
    font-size: 1.32rem; font-weight: 800;
    color: var(--accent); letter-spacing: 0.01em;
  }
  header p { font-size: 0.82rem; color: var(--muted); margin-top: 6px; }
  .lang-bar {
    display: flex; justify-content: center; gap: 7px;
    margin-top: 14px; flex-wrap: wrap;
  }
  .lang-btn {
    border: 2px solid var(--border); background: var(--card); color: var(--muted);
    font-size: 0.78rem; font-weight: 700; padding: 6px 13px; border-radius: 999px;
    cursor: pointer; transition: all .18s ease; font-family: inherit;
  }
  .lang-btn.active {
    background: var(--accent); color: #fff; border-color: var(--accent);
    box-shadow: 0 3px 0 #084464;
  }

  .notice {
    background: var(--accent-soft); border-radius: 14px; padding: 12px 15px;
    font-size: 0.78rem; color: var(--accent); margin-bottom: 18px; line-height: 1.55;
    border: 1px solid #cde1ef;
  }

  /* 多邻国风格：3 个大板块 */
  .modules-title {
    font-size: 0.82rem; font-weight: 800; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px;
  }
  .module-grid {
    display: flex; flex-direction: column; gap: 14px; margin-bottom: 22px;
  }
  .module-tile {
    background: var(--card);
    border: 2px solid var(--border);
    border-bottom: 5px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    cursor: pointer;
    transition: transform .12s ease, border-color .15s ease;
    display: flex; align-items: center; gap: 14px;
  }
  .module-tile:hover {
    border-color: #b7c6d4;
    border-bottom-color: #9fb2c4;
  }
  .module-tile:active {
    transform: translateY(2px);
    border-bottom-width: 3px;
  }
  .module-badge {
    width: 50px; height: 50px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; flex-shrink: 0; font-weight: 800;
  }
  .badge-1 { background: #e0f2fe; color: #0369a1; border: 2px solid #bae6fd; }
  .badge-2 { background: #fef3c7; color: #b45309; border: 2px solid #fde68a; }
  .badge-3 { background: #dcfce7; color: #15803d; border: 2px solid #bbf7d0; }

  .module-info { flex: 1; min-width: 0; }
  .module-tag {
    display: inline-block; font-size: 0.7rem; font-weight: 800;
    padding: 2px 8px; border-radius: 999px;
    background: #eef2f6; color: var(--muted); margin-bottom: 4px;
  }
  .module-info h2 { font-size: 1.02rem; font-weight: 800; line-height: 1.3; }
  .module-info .desc {
    font-size: 0.8rem; color: var(--muted); margin-top: 4px; line-height: 1.45;
  }
  .module-cta {
    background: var(--duo-green); color: #fff;
    font-size: 0.76rem; font-weight: 800;
    padding: 8px 12px; border-radius: 12px;
    border-bottom: 3px solid var(--duo-green-dark);
    flex-shrink: 0; white-space: nowrap;
  }

  /* 板块内解决步骤视图 */
  #lessonView { display: none; }
  #lessonView.active { display: block; }
  #homeView.hidden { display: none; }

  .top-nav {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 14px;
  }
  .back-btn {
    background: var(--card); border: 2px solid var(--border);
    border-bottom: 4px solid var(--border);
    color: var(--text); font-weight: 700; font-size: 0.8rem;
    padding: 8px 13px; border-radius: 12px; cursor: pointer;
    font-family: inherit; white-space: nowrap;
  }
  .back-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

  .progress-wrap {
    flex: 1; height: 12px; background: #e2e8f0;
    border-radius: 999px; overflow: hidden;
  }
  .progress-bar {
    height: 100%; width: 33%; background: var(--duo-green);
    border-radius: 999px; transition: width .25s ease;
  }
  .step-counter {
    font-size: 0.76rem; font-weight: 800; color: var(--muted);
    white-space: nowrap;
  }

  .lesson-header-card {
    background: var(--card); border: 2px solid var(--border);
    border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px;
  }
  .lesson-header-card h2 { font-size: 1.08rem; font-weight: 800; color: var(--accent); }
  .lesson-header-card p { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }

  .sub-card {
    background: var(--card); border: 2px solid var(--border);
    border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px;
  }
  .sub-title {
    font-size: 0.96rem; font-weight: 800; margin-bottom: 10px;
  }
  .step-row {
    display: flex; gap: 12px; padding: 11px 0;
    border-top: 1px solid #eef2f6;
  }
  .step-row:first-of-type { border-top: none; padding-top: 4px; }
  .step-pill {
    font-size: 0.7rem; font-weight: 800;
    color: var(--accent); background: var(--accent-soft);
    padding: 4px 8px; border-radius: 8px;
    height: fit-content; min-width: 84px; text-align: center;
    flex-shrink: 0;
  }
  .step-pill.warn { color: var(--warn); background: var(--warn-soft); }
  .step-body { font-size: 0.86rem; flex: 1; min-width: 0; }
  .step-body a {
    color: var(--accent); font-weight: 700; text-decoration: none;
    border-bottom: 1px solid rgba(11,94,138,.3);
  }
  .time-box {
    background: var(--duo-green-soft); border: 1px solid #bbf7d0;
    color: #14532d; border-radius: 10px; padding: 10px 12px;
    font-size: 0.82rem; line-height: 1.55; margin-top: 4px;
  }
  .doc-list { list-style: none; }
  .doc-list li {
    position: relative; padding-left: 16px; margin-bottom: 4px;
  }
  .doc-list li::before {
    content: "✓"; position: absolute; left: 0; top: 0;
    color: var(--duo-green); font-weight: 800; font-size: 0.8rem;
  }

  .law-toggle {
    display: inline-block; font-size: 0.76rem; font-weight: 700;
    color: var(--accent); margin-top: 8px; cursor: pointer;
    border-bottom: 1px dashed var(--accent);
  }
  .law-box {
    display: none; margin-top: 8px; padding: 11px 13px;
    background: #f8fafc; border-radius: 10px;
    font-size: 0.78rem; color: var(--text); line-height: 1.6;
    border-left: 4px solid var(--accent);
  }
  .law-box.show { display: block; }

  .lesson-footer-actions {
    display: flex; gap: 10px; margin-top: 16px;
  }
  .btn-next {
    flex: 1; background: var(--duo-green); color: #fff;
    border: none; border-bottom: 4px solid var(--duo-green-dark);
    padding: 13px 16px; border-radius: 14px;
    font-size: 0.88rem; font-weight: 800; cursor: pointer;
    font-family: inherit;
  }
  .btn-next:active { transform: translateY(2px); border-bottom-width: 2px; }

  /* 底部常用联络 */
  .contact-bar {
    background: var(--card); border: 2px solid var(--border);
    border-radius: var(--radius); padding: 16px 18px;
    margin-top: 10px; font-size: 0.82rem;
  }
  .contact-bar h3 {
    font-size: 0.8rem; font-weight: 800; color: var(--muted);
    letter-spacing: 0.04em; margin-bottom: 10px;
  }
  .contact-row {
    display: flex; gap: 10px; padding: 7px 0;
    border-top: 1px solid #f0f3f6; align-items: baseline;
  }
  .contact-row:first-of-type { border-top: none; }
  .contact-row .tag {
    font-size: 0.72rem; font-weight: 700; color: var(--accent);
    min-width: 96px; flex-shrink: 0;
  }
  .contact-row a { color: var(--accent); font-weight: 700; text-decoration: none; }

  .footer-note {
    text-align: center; font-size: 0.72rem; color: #8c99a6;
    margin-top: 22px; line-height: 1.6;
  }

  /* ===== PWA 安装按钮 ===== */
  #pwaInstallBtn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    padding: 10px 20px;
    border: none;
    border-radius: 999px;
    background: var(--duo-green);
    color: #fff;
    font-size: 0.85rem;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
    border-bottom: 3px solid var(--duo-green-dark);
  }
  #pwaInstallBtn[hidden] { display: none; }
  #pwaInstallBtn:active {
    transform: translateY(2px);
    border-bottom-width: 1px;
  }

  /* ===== iOS 安装引导浮层 ===== */
  #iosInstallGuide {
    display: none;
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 9999;
    background: #fff;
    border-radius: 20px 20px 0 0;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
    box-shadow: 0 -8px 30px rgba(0,0,0,.18);
    text-align: center;
    font-size: 0.9rem;
    line-height: 1.6;
  }
  #iosInstallGuide.show { display: block; }
  #iosInstallGuide .guide-close {
    position: absolute;
    top: 12px; right: 16px;
    background: none; border: none;
    font-size: 1.4rem; line-height: 1;
    color: var(--muted);
    cursor: pointer;
  }
  #iosInstallGuide .guide-icon {
    font-size: 2rem;
    margin-bottom: 6px;
  }
  #iosInstallGuide .guide-title {
    font-weight: 800;
    font-size: 1rem;
    margin-bottom: 4px;
  }
  #iosInstallGuide .guide-desc {
    color: var(--muted);
    font-size: 0.82rem;
  }
  #iosInstallGuide .guide-step {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 10px 0;
    font-weight: 700;
  }
  #iosInstallGuide .guide-arrow {
    color: var(--duo-green);
    font-size: 1.2rem;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1 id="appTitle"></h1>
    <p id="appSub"></p>
    <div class="lang-bar">
      <button class="lang-btn active" data-lang="zh" onclick="setLang('zh')">中文</button>
      <button class="lang-btn" data-lang="vi" onclick="setLang('vi')">Tiếng Việt</button>
      <button class="lang-btn" data-lang="my" onclick="setLang('my')">မြန်မာ</button>
      <button class="lang-btn" data-lang="en" onclick="setLang('en')">English</button>
      <button class="lang-btn" data-lang="pt" onclick="setLang('pt')">Português</button>
    </div>
    <button id="pwaInstallBtn" hidden onclick="handleInstallClick()"></button>
  </header>

  <div class="notice" id="noticeBox"></div>

  <!-- 视图 1：多邻国风格三大板块 -->
  <div id="homeView">
    <div class="modules-title" id="modulesLabel"></div>
    <div class="module-grid" id="moduleGrid"></div>
  </div>

  <!-- 视图 2：点击板块后进入的解决步骤 -->
  <div id="lessonView">
    <div class="top-nav">
      <button class="back-btn" id="backBtn" onclick="goHome()"></button>
      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <span class="step-counter" id="stepCounter"></span>
    </div>

    <div class="lesson-header-card">
      <h2 id="lessonTitle"></h2>
      <p id="lessonDesc"></p>
    </div>

    <div id="lessonStepsContainer"></div>

    <div class="lesson-footer-actions">
      <button class="btn-next" id="nextModuleBtn" onclick="nextModule()"></button>
    </div>
  </div>

  <!-- 底部联络 -->
  <div class="contact-bar">
    <h3 id="contactTitle"></h3>
    <div id="contactRows"></div>
  </div>

  <div class="footer-note" id="footerNote"></div>

</div>

<!-- iOS 安装引导浮层 -->
<div id="iosInstallGuide" role="dialog" aria-modal="true">
  <button class="guide-close" onclick="closeIosGuide()" aria-label="关闭">×</button>
  <div class="guide-icon">📲</div>
  <div class="guide-title" id="iosGuideTitle"></div>
  <div class="guide-desc" id="iosGuideDesc"></div>
  <div class="guide-step" id="iosGuideStep1"></div>
  <div class="guide-arrow">↓</div>
  <div class="guide-step" id="iosGuideStep2"></div>
</div>

<script>
const i18n = {
  zh: {
    appTitle: "澳门外雇权益助手",

    modulesLabel: "选择你的情况（共 3 大板块）",

    backBtn: "← 返回板块",

    },

      { tag: "劳工局地址", html: "澳门马揸度博士大马路 221–279 号先进广场" },

      { tag: "紧急求助", html: '<a href="tel:999">999</a>（紧急警务 / 救援）' }

      {

        title: "欠薪 / 拖工资 & 回程机票谁出",
        desc: "工资没到账、被拖欠，或劳动关系结束时回程机票由谁承担。",
        cases: [
          {
            title: "情况 A：老板不付工资 / 拖工资",
            who: "<strong>劳工事务局（DSAL）</strong><br>地址：澳门马揸度博士大马路 221–279 号先进广场<br>电话：<a href=\"tel:28717810\">2871 7810</a>",
            docs: [

            ],
            time: "<strong>20 分钟内</strong>接待并即时发《投诉回条》<br><strong>5 个工作天内</strong>短信/书面通知负责督察姓名和电话<br><strong>10 个工作天内</strong>通知处理结果",

let currentLang = "zh";
let activeModuleIndex = null;

function setLang(lang) {
  currentLang = lang;
  const langAttrMap = { zh: "zh-Hans", vi: "vi", my: "my", en: "en", pt: "pt" };
  document.documentElement.lang = langAttrMap[lang] || "en";
  document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.classList.toggle("active", btn.getAttribute("data-lang") === lang);
  });
  updatePwaText();
  renderAll();
}

function renderAll() {
  const t = i18n[currentLang];
  document.getElementById("appTitle").textContent = t.appTitle;
  document.getElementById("appSub").textContent = t.appSub;
  document.getElementById("noticeBox").textContent = t.notice;
  document.getElementById("modulesLabel").textContent = t.modulesLabel;
  document.getElementById("backBtn").textContent = t.backBtn;
  document.getElementById("contactTitle").textContent = t.contactTitle;
  document.getElementById("footerNote").textContent = t.footerNote;

  const grid = document.getElementById("moduleGrid");
  grid.innerHTML = t.modules.map((m, idx) => `
    <div class="module-tile" onclick="openModule(${idx})">
      <div class="module-badge ${m.badgeClass}">${m.badge}</div>
      <div class="module-info">
        <span class="module-tag">${m.tag}</span>
        <h2>${m.title}</h2>
        <div class="desc">${m.desc}</div>
      </div>
      <div class="module-cta">${t.startBtn}</div>
    </div>
  `).join("");

  document.getElementById("contactRows").innerHTML = t.contacts.map(c => `
    <div class="contact-row">
      <span class="tag">${c.tag}</span>
      <span>${c.html}</span>
    </div>
  `).join("");

  if (activeModuleIndex !== null) {
    renderLesson(activeModuleIndex);
  }
}

function openModule(idx) {
  activeModuleIndex = idx;
  document.getElementById("homeView").classList.add("hidden");
  document.getElementById("lessonView").classList.add("active");
  renderLesson(idx);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function goHome() {
  activeModuleIndex = null;
  document.getElementById("lessonView").classList.remove("active");
  document.getElementById("homeView").classList.remove("hidden");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function nextModule() {
  const total = i18n[currentLang].modules.length;
  if (activeModuleIndex < total - 1) {
    openModule(activeModuleIndex + 1);
  } else {
    goHome();
  }
}

function renderLesson(idx) {
  const t = i18n[currentLang];
  const m = t.modules[idx];
  const total = t.modules.length;

  document.getElementById("progressBar").style.width = `${Math.round(((idx + 1) / total) * 100)}%`;
  document.getElementById("stepCounter").textContent = `${idx + 1} / ${total}`;
  document.getElementById("lessonTitle").textContent = `${m.tag} · ${m.title}`;
  document.getElementById("lessonDesc").textContent = m.desc;

  const isLast = idx === total - 1;
  document.getElementById("nextModuleBtn").textContent = isLast ? t.allDoneBtn : t.nextModuleBtn;

  const container = document.getElementById("lessonStepsContainer");
  container.innerHTML = m.cases.map((c, cIdx) => {
    const docsHtml = `<ul class="doc-list">${c.docs.map(d => `<li>${d}</li>`).join("")}</ul>`;
    const checkHtml = c.check ? `
      <div class="step-row">
        <div class="step-pill warn">${t.labels.check}</div>
        <div class="step-body">${c.check}</div>
      </div>` : "";
    const ruleHtml = c.rule ? `
      <div class="step-row">
        <div class="step-pill warn">${t.labels.rule}</div>
        <div class="step-body">${c.rule}</div>
      </div>` : "";

    return `
      <div class="sub-card">
        <div class="sub-title">${c.title}</div>

        <div class="step-row">
          <div class="step-pill">${t.labels.who}</div>
          <div class="step-body">${c.who}</div>
        </div>

        <div class="step-row">
          <div class="step-pill">${t.labels.docs}</div>
          <div class="step-body">${docsHtml}</div>
        </div>

        ${checkHtml}
        ${ruleHtml}

        <div class="step-row">
          <div class="step-pill">${t.labels.time}</div>
          <div class="step-body">
            <div class="time-box">${c.time}</div>
            <span class="law-toggle" onclick="toggleLawBox(this, 'law-${idx}-${cIdx}')">${t.lawShow}</span>
            <div class="law-box" id="law-${idx}-${cIdx}">${c.law}</div>
          </div>
        </div>
      </div>
    `;
  }).join("");
}

function toggleLawBox(el, boxId) {
  const box = document.getElementById(boxId);
  const isOpen = box.classList.toggle("show");
  const t = i18n[currentLang];
  el.textContent = isOpen ? t.lawHide : t.lawShow;
}

// 注册 Service Worker
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(err => {
      console.warn("Service Worker 注册失败：", err);
    });
  });
}

(function () {
  const btn = document.getElementById("pwaInstallBtn");
  const iosGuide = document.getElementById("iosInstallGuide");

  const isStandalone =
    window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true;

  // 已安装模式下不显示按钮
  if (isStandalone) return;

  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

  let deferredPrompt = null;

  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    btn.hidden = false;
  });

  window.addEventListener("appinstalled", () => {
    deferredPrompt = null;
    btn.hidden = true;
    closeIosGuide();
  });

  if (isIOS) {
    btn.hidden = false;
  }

  window.handleInstallClick = async function () {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === "accepted") btn.hidden = true;
      deferredPrompt = null;
    } else if (isIOS) {
      iosGuide.classList.add("show");
    } else {
      alert((pwaText[currentLang] || pwaText.en).desktopHint);
    }
  };
})();

function closeIosGuide() {
  document.getElementById("iosInstallGuide").classList.remove("show");
}

updatePwaText();
